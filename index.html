<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seung Ho Yang — Developer × PM × Architect</title>
  <meta name="description" content="건축가이자 AI 개발자 양승호의 포트폴리오. RAG 챗봇, AI 공간기획, CAD 제품 기획, 건축설계 프로젝트.">
  <meta name="theme-color" content="#2a2230">
  <link rel="icon" href="src/Logo.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Noto+Serif+KR:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">

  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
  </script>
</head>
<body data-mode="gate">
  <canvas id="stage" aria-hidden="true"></canvas>
  <div id="fallback-bg" aria-hidden="true"></div>
  <div class="veil" aria-hidden="true"></div>

  <header class="topbar">
    <button id="menu-btn" class="menu-btn" type="button" aria-expanded="false" aria-controls="menu">
      <span class="menu-lines" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
      <span class="menu-label">Projects</span>
    </button>
    <a class="wordmark" href="#/" aria-label="처음으로">
      <span class="wm-1">Seung Ho</span>
      <span class="wm-2">Yang</span>
    </a>
  </header>

  <!-- 첫 화면 -->
  <section id="gate" class="gate" aria-labelledby="gate-name">
    <p id="gate-role" class="gate-role"></p>
    <h1 id="gate-name" class="gate-name"></h1>
    <p id="gate-intro" class="gate-intro"></p>
    <a id="gate-enter" class="enter-btn" href="#/">Enter</a>
    <button id="gate-list" class="text-btn" type="button">프로젝트 목록 바로 보기</button>
  </section>

  <!-- 챕터 넘기기 -->
  <main id="browse" class="browse" inert>
    <button id="prev" class="nav-arrow prev" type="button" aria-label="이전 프로젝트">
      <svg viewBox="0 0 24 48" aria-hidden="true"><path d="M22 2 2 24l20 22" /></svg>
    </button>

    <div id="chapter" class="chapter" aria-live="polite">
      <p id="chapter-period" class="chapter-period"></p>
      <h2 id="chapter-title" class="chapter-title"></h2>
      <p id="chapter-sub" class="chapter-sub"></p>
      <a id="enter-btn" class="enter-btn" href="#/">Enter</a>
    </div>

    <button id="next" class="nav-arrow next" type="button" aria-label="다음 프로젝트">
      <svg viewBox="0 0 24 48" aria-hidden="true"><path d="M2 2l20 22L2 46" /></svg>
    </button>

    <div class="counter" aria-hidden="true"><span id="current">01</span><i></i><span id="total">08</span></div>
    <nav id="ticks" class="ticks" aria-label="프로젝트 바로가기"></nav>
  </main>

  <!-- 전체 메뉴 -->
  <nav id="menu" class="menu" aria-label="전체 프로젝트" hidden>
    <ol id="menu-list" class="menu-list"></ol>
    <div id="menu-contacts" class="menu-contacts"></div>
  </nav>

  <!-- 상세 -->
  <article id="detail" class="detail" tabindex="-1" hidden>
    <button id="detail-close" class="detail-close" type="button"><span aria-hidden="true">←</span> 돌아가기</button>
    <div id="detail-inner" class="detail-inner"></div>
  </article>

  <dialog id="lightbox" class="lightbox">
    <button class="lightbox-close" type="button" aria-label="닫기">×</button>
    <img id="lightbox-img" alt="">
    <p id="lightbox-cap"></p>
  </dialog>

  <script type="module" src="js/app.js"></script>
</body>
</html>
